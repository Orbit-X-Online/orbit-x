name: Generate package-lock.json and vendor.lock.json

# Run by hand: GitHub app/site -> Actions -> "Generate package-lock.json" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: node scripts/vendor-libs.mjs
      - run: npm run check
      - run: npm test
      - name: Commit lockfile
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add package-lock.json scripts/vendor.lock.json
          git diff --cached --quiet || git commit -m "Add package-lock.json and vendor.lock.json"
          git push
