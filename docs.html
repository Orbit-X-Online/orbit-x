<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070B16">
<title>Orbit Connect API docs</title>
<link rel="stylesheet" href="/ox.css">
</head>
<body><div class="wrap" style="max-width:820px">
<div class="hdr"><div><b>Orbit Connect API</b><div class="sub">Generated from <a href="/openapi.json">openapi.json</a>. Only endpoints that exist are listed.</div></div><div class="links"><a href="/developer.html">Developer workspace</a><a href="/">Orbit-X</a></div></div>
<div id="app"><div class="empty"><span class="spin"></span>Loading</div></div></div>
<script src="/ox.js"></script>
<script>
var esc = OX.esc;
function md(s){ return esc(s || '').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); }
fetch('/openapi.json').then(function(r){ return r.json(); }).then(function(sp){
  var h = '<h1>' + esc(sp.info.title) + ' <span class="chip info">v' + esc(sp.info.version) + '</span></h1><p>' + md(sp.info.description) + '</p><div class="banner">Sandbox connectors and receiving systems are simulated. Synthetic data only.</div>';
  var groups = {};
  Object.keys(sp.paths).forEach(function(p){ Object.keys(sp.paths[p]).forEach(function(m){ var o = sp.paths[p][m], t = (o.tags && o.tags[0]) || 'Other'; (groups[t] = groups[t] || []).push([m, p, o]); }); });
  Object.keys(groups).forEach(function(t){
    h += '<h2>' + esc(t) + '</h2>';
    groups[t].forEach(function(e){
      var m = e[0], p = e[1], o = e[2], col = m === 'get' ? 'ok' : 'doc';
      h += '<details class="card"><summary><span class="chip ' + col + '">' + m.toUpperCase() + '</span><code>' + esc(p) + '</code> <span class="mut">' + esc(o.summary) + '</span></summary><p>' + md(o.description) + '</p>';
      if (o.requestBody) { var ex = o.requestBody.content['application/json'].example; h += '<h3>Request</h3><pre>' + esc(JSON.stringify(ex, null, 2)) + '</pre>'; }
      h += '<h3>Responses</h3>';
      Object.keys(o.responses).forEach(function(c){ var r = o.responses[c], ex = r.content && r.content['application/json'] && r.content['application/json'].example; h += '<div><span class="chip ' + (c[0] === '2' ? 'ok' : 'bad') + '">' + c + '</span> ' + esc(r.description || '') + (ex ? '<pre>' + esc(JSON.stringify(ex, null, 2)) + '</pre>' : '') + '</div>'; });
      h += '</details>';
    });
  });
  document.getElementById('app').innerHTML = h;
});
</script></body></html>
