<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070B16">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Orbit-X</title>
<style>
:root{--bg:#070B16;--card:#0E1730;--line:#25407A;--txt:#E6F0FF;--mut:#6C7FA8;--cy:#38BDF8;--teal:#5EEAD4;--red:#F87171;--pink:#F9A8A8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;justify-content:center}
.app{width:100%;max-width:440px;min-height:100%;display:flex;flex-direction:column;padding:12px 16px 18px;position:relative;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut)}
header b{color:var(--txt);font-size:16px;letter-spacing:.5px}
.status{display:flex;align-items:center;gap:6px;color:#7DD3FC}
.dot{width:7px;height:7px;border-radius:50%;background:var(--teal)}
.app>*{flex-shrink:0}
.stage{position:relative;height:300px;margin-top:4px;flex:none;overflow:visible}
#face{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:260px;height:260px}
.chip{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:12px;color:#7DD3FC;transition:opacity .4s,transform .4s}
.chip b{display:block;font-size:15px;color:var(--txt);font-weight:600}
#c1{left:0;top:18px}#c2{right:0;bottom:22px}#c2 b{color:var(--pink)}
.hide{opacity:0;transform:scale(.9);pointer-events:none}
.caption{min-height:70px;text-align:center;font-size:17px;line-height:1.4;padding:4px 8px}
.caption.proof{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px}
.hint{text-align:center;font-size:12px;color:var(--mut);min-height:16px}
.row{display:flex;gap:8px;margin:10px 0}
.row button,.q{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:10px 6px;font-size:13px;cursor:pointer}
.inputbar{display:flex;gap:8px;align-items:center;margin-top:auto}
.inputbar input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:12px 16px;font-size:15px;outline:none}
#mic{width:56px;height:56px;border-radius:50%;border:0;background:#2563EB;color:#fff;font-size:22px;cursor:pointer;position:relative;flex:none}
#mic.on{background:#16A34A}
#mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--cy);animation:pr 1.2s ease-out infinite}
@keyframes pr{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
#send{flex:none;background:none;border:0;color:#7DD3FC;font-size:14px;cursor:pointer;padding:6px}
.demo{margin:12px 0 4px;padding:8px 10px;border:1px dashed var(--line);border-radius:12px;font-size:12px;color:var(--mut)}
.demo input{width:100%;accent-color:#38BDF8}
.demo .l{display:flex;justify-content:space-between;margin-bottom:4px}
.demo button{margin-top:6px;background:none;border:1px solid var(--line);color:#7DD3FC;border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer}
.overlay{position:absolute;inset:0;background:var(--bg);padding:16px;overflow:auto;display:none;z-index:5}
.overlay.on{display:block}
.overlay h2{font-size:16px;text-align:center;margin:6px 0 12px;font-weight:500}
.quote{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px}
.ev small{display:block;color:#7DD3FC;font-size:12px}.ev span{font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:999px;background:#2563EB;color:#fff;font-size:15px;font-weight:500;padding:12px;margin-top:14px;cursor:pointer}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--txt)}
#emer{background:#2a0a0a;z-index:8}
#emer .big{font-size:20px;line-height:1.35;text-align:center;margin:30px 8px 18px}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--red);margin:28px auto 0;animation:pr 1s ease-out infinite}
#ring{background:#070B16;z-index:9;text-align:center}
#ring .who{font-size:24px;font-weight:600;margin-top:60px}
#ring .sub{color:var(--pink);margin-top:6px}
#ring .av{width:120px;height:120px;border-radius:50%;margin:34px auto;background:#0C1A33;border:1.5px solid var(--cy);position:relative;display:grid;place-items:center;font-size:44px}
#ring .av::before,#ring .av::after{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--cy);animation:pr 1.8s ease-out infinite}
#ring .av::after{animation-delay:.9s}
.cb{display:flex;justify-content:space-around;margin-top:50px}
.cb button{width:70px;height:70px;border-radius:50%;border:0;color:#fff;font-size:26px;cursor:pointer}
.cb .no{background:#DC2626}.cb .yes{background:#16A34A}
.tl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:13px;text-align:left}
.tl div{padding:3px 0}
.idle{color:var(--mut);text-align:center;margin-top:60px;font-size:14px;line-height:1.6}
.banner{background:#0b2a1a;border:1px solid #166534;color:#86efac;border-radius:12px;padding:10px 12px;text-align:center;font-size:14px;margin-top:10px;display:none}
.banner.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.field{display:block;width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;margin-top:6px}
label.l{display:block;font-size:13px;color:#7DD3FC;margin-top:14px}
.check{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:15px}
.check input{width:20px;height:20px;accent-color:#38BDF8}
a.btn{text-decoration:none;text-align:center}
.btn.red{background:#DC2626}.btn.green{background:#16A34A}
.small{font-size:12px;color:var(--mut);line-height:1.5}
.center{text-align:center}
.cg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.cg b{font-size:15px}.cg .st{font-size:12px;color:var(--mut)}.cg .st.ok{color:#86efac}
.cg .acts{display:flex;gap:8px;margin-top:8px}.cg .acts button{flex:1;background:none;border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px;font-size:13px;cursor:pointer}
.code{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:1px;text-align:center;padding:12px;background:var(--card);border:1px dashed var(--cy);border-radius:12px;margin:10px 0;word-break:break-all}
.sos{margin-top:6px;background:#3a0d0d;border:1px solid #7f1d1d;color:#fecaca;border-radius:999px;padding:11px;font-size:14px;width:100%;cursor:pointer}
.link{background:none;border:0;color:#7DD3FC;font-size:13px;cursor:pointer;padding:8px;text-decoration:underline}
.sum{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.5}
.sum small{color:#7DD3FC;display:block;font-size:12px}
.err{color:#fca5a5;font-size:13px;margin-top:8px;min-height:16px}
.top{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="data.js"></script>
<script>
(function(){
'use strict';
var D = window.OrbitData;
var app = document.getElementById('app');
var params = new URLSearchParams(location.search);
var SKEY = 'orbitx.session.v1';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return (n < 10 ? '0' : '') + n; }
function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function clock(t){ var d = new Date(t); var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + pad(m) + ' ' + ap; }
function loadSession(){ try { return JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch(e){ return null; } }
function saveSession(s){ try { localStorage.setItem(SKEY, JSON.stringify(s)); } catch(e){} }
function clearSession(){ try { localStorage.removeItem(SKEY); } catch(e){} }
var sess = loadSession();
var st = null;            // last state from the server
var timer = null;

/* ---------- network ---------- */
function api(method, path, body){
  var headers = { 'Content-Type': 'application/json' };
  if (sess && sess.token) headers.Authorization = 'Bearer ' + sess.token;
  return fetch(path, { method: method, headers: headers, body: body === undefined ? undefined : JSON.stringify(body), cache: 'no-store' })
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ j._status = r.status; return j; }); })
    .catch(function(){ return { ok: false, _status: 0, error: 'offline' }; });
}
function hApi(action, body){ return api(action === 'state' ? 'GET' : 'POST', '/api/h/' + sess.pid + '/' + action, body === undefined && action !== 'state' ? {} : body); }
function take(j){ if (j && j.ok && j.profile) { st = j; return true; } return false; }
function gone(j){ return j && (j._status === 401 || j._status === 404); }

/* ---------- face + voice ---------- */
var faceStyle = document.createElement('style');
faceStyle.textContent = '#mouth .mb{transform-box:fill-box;transform-origin:center;transform:scaleY(.35)}#mouth.talk .mb{animation:eq .55s ease-in-out infinite alternate}#mouth.talk .mb:nth-child(2){animation-delay:.12s}#mouth.talk .mb:nth-child(3){animation-delay:.24s}#mouth.talk .mb:nth-child(4){animation-delay:.06s}#mouth.talk .mb:nth-child(5){animation-delay:.18s}@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}#eyes{animation:bl 5s infinite;transform-box:fill-box;transform-origin:center}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}';
document.head.appendChild(faceStyle);
function faceSvg(){
  return '<svg id="face" viewBox="0 0 260 260" role="img" aria-label="Orbit, the AI assistant face"><defs><radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#38BDF8" stop-opacity=".28"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient><linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12284D"/><stop offset="1" stop-color="#0A1630"/></linearGradient></defs>' +
  '<circle cx="130" cy="130" r="128" fill="url(#g)"/><ellipse cx="130" cy="130" rx="122" ry="34" transform="rotate(-20 130 130)" fill="none" stroke="#38BDF8" stroke-width=".8" stroke-dasharray="3 6" opacity=".6"><animateTransform attributeName="transform" type="rotate" from="-20 130 130" to="340 130 130" dur="40s" repeatCount="indefinite"/></ellipse>' +
  '<path d="M130 38 C86 38 66 74 66 118 C66 168 92 214 130 222 C168 214 194 168 194 118 C194 74 174 38 130 38Z" fill="url(#skin)" stroke="#38BDF8" stroke-width="1.2"/>' +
  '<path d="M72 96 Q130 70 188 96" fill="none" stroke="#38BDF8" stroke-width=".6" opacity=".35"/><path d="M76 160 Q130 186 184 160" fill="none" stroke="#38BDF8" stroke-width=".6" opacity=".3"/><path d="M130 44 L130 214" stroke="#38BDF8" stroke-width=".5" opacity=".18"/>' +
  '<g id="eyes" fill="#7DD3FC"><rect x="96" y="108" width="26" height="6" rx="3"/><rect x="138" y="108" width="26" height="6" rx="3"/></g><path d="M130 118 L124 150 L131 152" fill="none" stroke="#38BDF8" stroke-width=".9" opacity=".7"/>' +
  '<g id="mouth" fill="#5EEAD4"><rect class="mb" x="104" y="176" width="6" height="8" rx="3"/><rect class="mb" x="114" y="172" width="6" height="16" rx="3"/><rect class="mb" x="124" y="168" width="6" height="24" rx="3"/><rect class="mb" x="134" y="168" width="6" height="24" rx="3"/><rect class="mb" x="144" y="172" width="6" height="16" rx="3"/><rect class="mb" x="154" y="176" width="6" height="8" rx="3"/></g></svg>';
}
var voiceOn = true, listening = false, rec = null;
function faceTalk(on){ var f = $('mouth'); if (f) f.classList.toggle('talk', on); var s = $('stat'); if (s) s.textContent = on ? 'Speaking' : (listening ? 'Listening' : 'Ready'); }
function setCaption(text, proof){ var c = $('cap'); if (!c) return; c.textContent = text; c.classList.toggle('proof', !!proof); c.dataset.proof = proof ? '1' : ''; }
function hint(t){ var h = $('hint'); if (h) h.textContent = t; }
function say(text, cb){
  setCaption(text);
  if (!voiceOn || !('speechSynthesis' in window)) { faceTalk(true); setTimeout(function(){ faceTalk(false); cb && cb(); }, Math.min(3500, 600 + text.length * 35)); return; }
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.rate = 0.95;
    u.onstart = function(){ faceTalk(true); }; u.onend = u.onerror = function(){ faceTalk(false); cb && cb(); };
    speechSynthesis.speak(u);
  } catch(e){ faceTalk(false); }
}
function listen(onText){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { hint('Voice input is not available on this browser. Please type.'); var t = $('txt'); if (t) t.focus(); return; }
  if (listening) { try { rec.stop(); } catch(e){} return; }
  try {
    rec = new SR(); rec.lang = 'en-NG'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onstart = function(){ listening = true; $('mic').classList.add('on'); hint('Listening...'); faceTalk(false); };
    rec.onend = function(){ listening = false; $('mic').classList.remove('on'); hint(''); };
    rec.onerror = function(){ listening = false; $('mic').classList.remove('on'); hint('I could not hear that. Please type or tap a button.'); };
    rec.onresult = function(e){ var t = e.results[0][0].transcript; $('txt').value = t; onText(t); };
    rec.start();
  } catch(e){ hint('The microphone is blocked. Please type.'); }
}

/* ---------- welcome / sign-up / join / restore ---------- */
function stopTimer(){ if (timer) { clearTimeout(timer); timer = null; } }
function tzNow(){ return -new Date().getTimezoneOffset(); }
function welcome(msg){
  stopTimer();
  app.innerHTML = '<div class="top"><b style="font-size:16px">Orbit-X</b><span class="small">Not a doctor. Emergency: 112</span></div>' +
  '<div class="stage" style="height:210px;margin-bottom:6px">' + faceSvg() + '</div>' +
  '<div class="center" style="font-size:20px;line-height:1.35;margin:2px 8px 4px">Hello. I am Orbit.</div>' +
  '<div class="center small" style="margin:0 10px 12px;font-size:14px">I help you keep track of your blood pressure and tablets, and I make sure your family knows if you need help. I never give medical advice.</div>' +
  (msg ? '<div class="err center">' + esc(msg) + '</div>' : '') +
  '<div class="small" style="margin:4px 2px 0">Who are you?</div>' +
  '<button class="btn" id="go">I want to look after my own health</button>' +
  '<button class="btn ghost" id="cgv">I am a family member or caregiver (I have an invite)</button>' +
  '<button class="btn ghost" id="pro">I am a doctor, clinic or organisation</button>' +
  '<div class="demo" style="margin-top:16px"><b style="color:#7DD3FC">Just want to look around? (demo, not the real app)</b><div class="small" style="margin-top:4px">Nothing here is saved or sent to anyone. It uses pretend people.</div><button class="btn ghost" id="dm" style="margin-top:8px">Watch the 1-minute demo story</button><button class="btn ghost" id="syn" style="margin-top:8px">Try it with a pretend patient (sandbox)</button></div>' +
  '<div class="center" style="margin-top:12px"><a class="link" href="/guide.html" style="text-decoration:none">How Orbit-X works, in simple words</a> <button class="link" id="rst">Restore my account</button></div>' +
  '<div class="small center" style="margin-top:10px">Built with Muse Spark Open. Orbit-X is not a medical device.</div>';
  $('syn').onclick = function(){ $('syn').disabled = true; api('POST', '/api/create', { name: 'Amara Okafor', slots: [], today: todayStr(), accountType: 'provider', org: 'Sandbox' }).then(function(j){ if (!j.ok) { $('syn').disabled = false; return; } sess = { role: 'patient', pid: j.pid, token: j.token, name: 'Amara Okafor', synthetic: true, accountType: 'provider' }; saveSession(sess); location.href = '/workspace.html?sample=1'; }); };
  $('go').onclick = onboard; $('pro').onclick = onboardPro; $('cgv').onclick = function(){ codeScreen('join'); }; $('rst').onclick = function(){ codeScreen('restore'); };
  $('dm').onclick = function(){ location.href = 'demo.html'; };
}
function onboard(){
  app.innerHTML = '<div class="top"><b>Orbit-X</b><button class="link" id="bk">Back</button></div><h2 style="font-weight:500;font-size:20px;margin:18px 0 0">Let us set you up</h2>' +
  '<label class="l" for="nm">What should I call you?</label><input class="field" id="nm" maxlength="40" autocomplete="given-name" placeholder="Your name">' +
  '<label class="l" for="ph">Your phone number (optional)</label><input class="field" id="ph" type="tel" maxlength="20" autocomplete="tel" placeholder="+234 801 234 5678"><div class="small" style="margin-top:4px">So your family can call you straight from an alert.</div>' +
  '<label class="l">When do you take regular medicine?</label>' +
  '<label class="check"><input type="checkbox" id="sm"> Morning</label><label class="check"><input type="checkbox" id="sa"> Afternoon</label><label class="check"><input type="checkbox" id="se"> Evening</label><label class="check"><input type="checkbox" id="sg"> Night</label>' +
  '<div class="small" style="margin-top:6px">Leave all empty if you do not take regular medicine. I will remind you at these times. You can change this later.</div>' +
  '<div class="small" style="margin-top:14px">Your readings stay private to you and the family members you invite. Orbit-X is not a doctor and does not give medical advice. If you feel very unwell, call 112.</div>' +
  '<div class="err" id="er"></div><button class="btn" id="st">Start</button>';
  $('bk').onclick = function(){ welcome(); };
  $('st').onclick = function(){
    var name = $('nm').value.trim(); if (!name) { $('er').textContent = 'Please tell me your name.'; return; }
    var slots = []; if ($('sm').checked) slots.push('morning'); if ($('sa').checked) slots.push('afternoon'); if ($('se').checked) slots.push('evening'); if ($('sg').checked) slots.push('night');
    $('st').disabled = true; $('er').textContent = '';
    api('POST', '/api/create', { name: name, slots: slots, phone: $('ph').value, today: todayStr(), tz: tzNow(), accountType: 'individual' }).then(function(j){
      if (!j.ok) { $('st').disabled = false; $('er').textContent = j._status === 0 ? 'No internet connection. Please try again.' : 'Something went wrong. Please try again.'; return; }
      sess = { role: 'patient', pid: j.pid, token: j.token, firstRun: true, accountType: 'individual' }; saveSession(sess); location.href = '/?guardian=1';
    });
  };
}
function onboardPro(){
  app.innerHTML = '<div class="top"><b>Orbit-X</b><button class="link" id="bk">Back</button></div><h2 style="font-weight:500;font-size:20px;margin:18px 0 0">Doctor, clinic or organisation</h2>' +
  '<div class="small" style="margin-top:6px">This gives you the Developer area: API keys, record import and emergency handoff. It is separate from the personal app. Use synthetic (pretend) data only while Orbit-X is a hackathon project.</div>' +
  '<label class="l" for="nm">Your name</label><input class="field" id="nm" maxlength="40" autocomplete="name" placeholder="Dr Ade">' +
  '<label class="l" for="og">Clinic or organisation</label><input class="field" id="og" maxlength="60" placeholder="City Clinic">' +
  '<div class="err" id="er"></div><button class="btn" id="st">Create organisation account</button><div class="center"><a class="link" href="/docs.html" style="text-decoration:none">Read the API docs first</a></div>';
  $('bk').onclick = function(){ welcome(); };
  $('st').onclick = function(){
    var name = $('nm').value.trim(), og = $('og').value.trim(); if (!name || !og) { $('er').textContent = 'Please fill in both boxes.'; return; }
    $('st').disabled = true; $('er').textContent = '';
    api('POST', '/api/create', { name: name, org: og, slots: [], today: todayStr(), tz: tzNow(), accountType: 'provider' }).then(function(j){
      if (!j.ok) { $('st').disabled = false; $('er').textContent = j._status === 0 ? 'No internet connection. Please try again.' : 'Something went wrong. Please try again.'; return; }
      sess = { role: 'patient', pid: j.pid, token: j.token, name: name, accountType: 'provider' }; saveSession(sess); location.href = '/developer.html';
    });
  };
}
function codeScreen(kind){
  var join = kind === 'join';
  app.innerHTML = '<div class="top"><b>Orbit-X</b><button class="link" id="bk">Back</button></div><h2 style="font-weight:500;font-size:20px;margin:18px 0 0">' + (join ? 'Join as a caregiver' : 'Restore my account') + '</h2>' +
  '<div class="small" style="margin-top:6px">' + (join ? 'Paste the invite code or open the invite link you were sent.' : 'Enter the recovery key from Settings on your old phone.') + '</div>' +
  '<input class="field" id="cd" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="' + (join ? 'Invite code' : 'Recovery key') + '"><div class="err" id="er"></div><button class="btn" id="ok">' + (join ? 'Join' : 'Restore') + '</button>';
  $('bk').onclick = function(){ welcome(); };
  $('ok').onclick = function(){
    var v = $('cd').value.trim(); if (!v) return;
    $('ok').disabled = true;
    if (join) doJoin(v, function(m){ $('ok').disabled = false; $('er').textContent = m; });
    else {
      var p = v.split('.'); if (p.length !== 2) { $('ok').disabled = false; $('er').textContent = 'That key does not look right.'; return; }
      sess = { role: 'patient', pid: p[0].toLowerCase(), token: p[1] };
      hApi('state').then(function(j){ if (take(j)) { saveSession(sess); patientApp(); } else { sess = null; $('ok').disabled = false; $('er').textContent = 'I could not find that account.'; } });
    }
  };
}
function doJoin(code, fail){
  api('POST', '/api/join', { code: code }).then(function(j){
    if (!j.ok) { fail(j._status === 0 ? 'No internet connection. Please try again.' : 'That invite code is not valid, or it was already used on another phone. Ask the person to open Family and tap New invite.'); return; }

}

/* ---------- fall guard ---------- */
/* Plain code watches the phone's motion sensor: free fall, then a hard hit, then lying still.

function onMotion(e){
  var a = e.accelerationIncludingGravity; if (!a || a.x == null) return;
  var m = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z), n = Date.now();
  if (n < fs.cool) return;
  if (fs.phase === 'idle') { if (m < 3) { if (!fs.fs) fs.fs = n; if (n - fs.fs >= 120) { fs.phase = 'free'; fs.at = n; } } else fs.fs = 0; }
  else if (fs.phase === 'free') { if (n - fs.at > 1500) { fs.phase = 'idle'; fs.fs = 0; } else if (m > 28) { fs.phase = 'hit'; fs.at = n; fs.lo = 99; fs.hi = 0; fs.sum = 0; fs.n = 0; } }
  else if (fs.phase === 'hit') {
    if (n - fs.at < 800) return;
    fs.lo = Math.min(fs.lo, m); fs.hi = Math.max(fs.hi, m); fs.sum += m; fs.n++;
    if (n - fs.at >= 2800) { var avg = fs.sum / Math.max(1, fs.n); fs.phase = 'idle'; fs.fs = 0; if (fs.hi - fs.lo < 5 && Math.abs(avg - 9.8) < 2.5) askFall(); }
  }
}
function fallStart(){
  window.addEventListener('devicemotion', onMotion);
}
function fallStop(){ window.removeEventListener('devicemotion', onMotion); }
function askFall(){
  if (fallTimer || !sess || sess.role !== 'patient') return;
  fs.cool = Date.now() + 60000;
  var o = document.getElementById('fallo');
  if (!o) { o = document.createElement('div'); o.id = 'fallo'; o.className = 'overlay'; o.style.zIndex = 20; app.appendChild(o); }
  var left = 15; o.classList.add('on');
  function draw(){ var nm = $('fnum'); if (nm) { nm.textContent = left; return; } o.innerHTML = '<div class="big" style="margin-top:60px;text-align:center;font-size:26px">Did you fall?</div><div class="center" id="fnum" style="font-size:64px;margin:20px 0">' + left + '</div><div class="center small" style="margin-bottom:18px">If you do not answer, I will alert your family.</div><button class="btn" id="fok">I am okay</button><button class="btn ghost" id="fhp" style="color:#fca5a5">I need help</button>'; $('fok').onclick = stopAsk; $('fhp').onclick = function(){ stopAsk(); startHelp('Fall detected. The person asked for help.'); }; }
  function stopAsk(){ clearInterval(fallTimer); fallTimer = null; o.classList.remove('on'); o.innerHTML = ''; }
  draw(); say('Did you fall? Tap I am okay, or I will alert your family.');
  try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch(e){}
  fallTimer = setInterval(function(){ left--; if (left <= 0) { stopAsk(); startHelp('Fall detected. No reply from ' + st.profile.name + '.'); } else draw(); }, 1000);
}
function fallEnable(cb){
  var DM = window.DeviceMotionEvent;
  if (!DM) { cb(false, 'This phone or browser has no motion sensor.'); return; }
  var go = function(){ try { localStorage.setItem(FKEY, '1'); } catch(e){} fallStart(); cb(true); };
  if (typeof DM.requestPermission === 'function') DM.requestPermission().then(function(r){ if (r === 'granted') go(); else cb(false, 'Motion permission was not allowed.'); }, function(){ cb(false, 'Motion permission was not allowed.'); });
  else go();
}
function fallDisable(){ try { localStorage.removeItem(FKEY); } catch(e){} fallStop(); }

/* settings */
function showSettings(){
  var o = $('seo'), sl = st.profile.slots;
  o.innerHTML = '<h2>Settings</h2><label class="l" for="sn">Your name</label><input class="field" id="sn" maxlength="40" value="' + esc(st.profile.name) + '">' +
    '<label class="l" for="sp">Your phone number</label><input class="field" id="sp" type="tel" maxlength="20" value="' + esc(st.profile.phone || '') + '"><div class="small" style="margin-top:4px">So your family can call you from an alert.</div>' +
    '<label class="l">Medicine times</label><label class="check"><input type="checkbox" id="sm"' + (sl.indexOf('morning') > -1 ? ' checked' : '') + '> Morning</label><label class="check"><input type="checkbox" id="sa"' + (sl.indexOf('afternoon') > -1 ? ' checked' : '') + '> Afternoon</label><label class="check"><input type="checkbox" id="se"' + (sl.indexOf('evening') > -1 ? ' checked' : '') + '> Evening</label><label class="check"><input type="checkbox" id="sg"' + (sl.indexOf('night') > -1 ? ' checked' : '') + '> Night</label>' +
    '<label class="check"><input type="checkbox" id="ta"' + (st.profile.tabletAlerts ? ' checked' : '') + '> Tell my caregivers if I have not logged a tablet</label><div class="small" style="margin-top:4px">I remind you first. If you still have not logged it a few hours later, your caregivers get a gentle heads-up. They are not rung.</div>' +
    '<button class="btn" id="sv">Save</button>' +
    '<label class="l">Phone alerts on this phone</label><div class="small">Lets Orbit-X remind you about tablets and tell you if nobody answered, even when this page is closed.</div><div class="err" id="ale"></div><button class="btn ghost" id="alb">' + (st.profile.alertsOn ? 'Phone alerts are ON. Send a test' : 'Turn on phone alerts') + '</button>' +
    '<label class="l">Recovery key</label><div class="small">If you lose this phone, this key restores your account on a new one. Keep it private.</div><button class="btn ghost" id="rk">Show my recovery key</button><div class="code" id="rkv" style="display:none;font-size:13px"></div>' +
    '<label class="l">Fall guard</label><div class="small">If your phone falls and then lies still, Orbit asks "Did you fall?" If you do not answer in 15 seconds, your family is alerted. Works while Orbit-X is open on this phone with the screen on.</div><label class="check"><input type="checkbox" id="fg"' + (fallOn() ? ' checked' : '') + '> Turn on fall guard</label><div class="err" id="fge"></div><button class="btn ghost" id="fgt">Test it now</button>' +
    '<label class="l">Alert rules your care team wrote</label>' + (st.rules.length ? st.rules.map(function(r){ return '<div class="cg"><b>' + esc(r.name) + '</b><div class="small">' + esc(r.readback) + '</div><div class="small">Written by ' + esc(r.author) + '</div></div>'; }).join('') : '<div class="small">None yet. Add a doctor in Family and they can write rules in plain words.</div>') +
    (sess.accountType === 'individual' ? '<label class="l">Doctors and clinics</label><div class="small">Connecting hospital software is only for doctor and organisation accounts. Your personal account keeps things simple and private.</div>' : '<label class="l">Connect another app (Orbit API)</label><div class="small">Give a key to a clinic app, a fall sensor or a smart watch. When it sends a signal, the same alert chain runs.</div><div id="kl">' + (st.apiKeys || []).map(function(k){ return '<div class="cg"><b>' + esc(k.label) + '</b><div class="acts"><button data-kd="' + esc(k.id) + '">Delete key</button></div></div>'; }).join('') + '</div><button class="btn ghost" id="kn">Create a key</button><div class="code" id="kv" style="display:none;font-size:12px;word-break:break-all"></div>') +
    '<div style="height:10px"></div><button class="btn ghost" id="so">Sign out on this phone</button><button class="btn ghost" id="dl" style="color:#fca5a5">Delete my account and data</button><button class="btn ghost" id="sb">Close</button>';
  o.classList.add('on'); $('sb').onclick = function(){ o.classList.remove('on'); };
  $('sv').onclick = function(){ var s = []; if ($('sm').checked) s.push('morning'); if ($('sa').checked) s.push('afternoon'); if ($('se').checked) s.push('evening'); if ($('sg').checked) s.push('night'); hApi('profile', { name: $('sn').value, phone: $('sp').value, tabletAlerts: $('ta').checked, tz: tzNow(), slots: s }).then(function(j){ if (take(j)) { refreshCards(); o.classList.remove('on'); say('Saved.'); } }); };
  $('alb').onclick = function(){ if (st.profile.alertsOn) { hApi('testpush', {}).then(function(j){ $('ale').textContent = j && j.ok ? 'Test sent. Look at your notifications.' : 'Could not send the test.'; }); return; } enableAlerts(function(ok, m){ $('ale').textContent = ok ? 'Phone alerts are on.' : m; if (ok) $('alb').textContent = 'Phone alerts are ON. Send a test'; }, true); };
  $('fg').onchange = function(){ if ($('fg').checked) fallEnable(function(ok, m){ if (!ok) { $('fg').checked = false; $('fge').textContent = m; } }); else fallDisable(); };
  $('fgt').onclick = function(){ o.classList.remove('on'); askFall(); };
  if ($('kn')) $('kn').onclick = function(){ hApi('apikey', { label: 'My app' }).then(function(j){ if (take(j) && j.key) { var v = $('kv'); v.style.display = 'block'; v.textContent = j.key; $('kn').style.display = 'none'; } else say('You can have up to 3 keys.'); }); };
  o.querySelectorAll('[data-kd]').forEach(function(b){ b.onclick = function(){ hApi('apikeydel', { id: b.getAttribute('data-kd') }).then(function(j){ if (take(j)) showSettings(); }); }; });
  $('rk').onclick = function(){ var v = $('rkv'); v.style.display = 'block'; v.textContent = sess.pid + '.' + sess.token; };
  $('so').onclick = function(){ if (confirm('Sign out? You will need your recovery key to come back.')) { clearSession(); sess = null; st = null; welcome(); } };
  $('dl').onclick = function(){ if (confirm('Delete your account and all your data? This cannot be undone.')) hApi('delete').then(function(j){ if (j && j.ok) { clearSession(); sess = null; st = null; welcome('Your account and data were deleted.'); } }); };
}

/* ---------- CAREGIVER ---------- */
var armed = false, ringCtx = null, wake = null, alertMsg = '';
function beep(){
  try { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ringCtx = ringCtx || new AC();
    var o = ringCtx.createOscillator(), g = ringCtx.createGain(); o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(ringCtx.destination);
    g.gain.setValueAtTime(.0001, ringCtx.currentTime); g.gain.exponentialRampToValueAtTime(.25, ringCtx.currentTime + .05); g.gain.exponentialRampToValueAtTime(.0001, ringCtx.currentTime + .5); o.start(); o.stop(ringCtx.currentTime + .55); } catch(e){}
}
function keepAwake(){ try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(l){ wake = l; }, function(){}); } catch(e){} }
document.addEventListener('visibilitychange', function(){ if (!document.hidden && armed) keepAwake(); });
function caregiverApp(){
  stopTimer();
  app.innerHTML = '<div class="top"><b style="font-size:16px">Orbit-X</b><span class="small">' + esc(sess.name || 'Caregiver') + '</span></div><div id="cgv" style="position:relative;flex:1"></div>';
  cgRender(); cgPoll(); quietResync();
}
function cgPoll(){
  hApi('state').then(function(j){
    if (gone(j)) { clearSession(); sess = null; welcome('You were removed as a caregiver, or the invite was replaced.'); return; }
    take(j); cgRender();
    var active = st && st.alert && (st.alert.status === 'ringing' || st.alert.status === 'answered');
    stopTimer(); timer = setTimeout(cgPoll, active ? 1500 : (st && st.profile && st.profile.alertsOn ? 20000 : 5000)); // push wakes the phone, so idle polling can be slow (saves free-plan requests)
  });
}
function cgRender(){
  var el = $('cgv'); if (!el) return;
  var who = (st && st.profile.name) || sess.patientName || 'them';
  if (!armed && !(st && st.profile && st.profile.alertsOn)) {
    el.innerHTML = '<div class="idle"><b>You are a caregiver for ' + esc(who) + '</b><br>Step 1: tap the blue button below.<br>Step 2: tap Allow when your phone asks about notifications.<br>Then this phone gets an alert even when Orbit-X is closed.</div><button class="btn" id="arm">Arm this phone</button><div class="center"><button class="link" id="lv">Stop being a caregiver</button></div>';
    $('arm').onclick = function(){ armed = true; beep(); keepAwake(); cgRender(); enableAlerts(function(ok, m){ alertMsg = ok ? '' : m; cgRender(); }, true); };
    $('lv').onclick = function(){ if (confirm('Leave? You will no longer be alerted.')) { clearSession(); sess = null; st = null; welcome(); } };
    return;
  }
  if (!st) { el.innerHTML = '<div class="idle"><b>Connecting...</b><br>Check your internet. Keep this page open.</div>'; return; }
  var a = st.alert, me = st.me && st.me.id, an = analysis();
  var summary = '<div class="sum"><small>' + esc(who) + '</small>' + (an.last ? 'Last reading ' + an.last.sys + '/' + an.last.dia + ' on ' + esc(D.fmtDate(an.lastDate)) + '.' : 'No readings yet.') + '<br>' + esc(an.sentence) + '</div>';
  if (a && a.status === 'ringing' && a.target === me) {
    beep(); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch(e){}
    el.innerHTML = '<div id="ring" class="overlay on" style="position:absolute"><div style="color:#7DD3FC;margin-top:28px">Orbit-X alert</div><div class="who">' + esc(who) + '</div><div class="sub">' + (a.sys ? 'Blood pressure dangerously high' : 'Needs help now') + '</div><div class="av">&#129504;</div><div style="color:#6C7FA8;font-size:13px">' + (a.chainNames.length > 1 && a.chainNames[a.chainNames.length - 1] !== st.me.name ? 'No answer in ' + a.secondsLeft + 's? The next person is called' : 'Please answer now') + '</div><div class="cb"><button class="no" id="decl" aria-label="Decline">&#10005;</button><button class="yes" id="ans" aria-label="Answer">&#10003;</button></div></div>';
    $('ans').onclick = function(){ hApi('answer').then(function(j){ take(j); cgRender(); }); };
    $('decl').onclick = function(){ hApi('decline').then(function(j){ take(j); cgRender(); }); };
    return;
  }
  if (a && a.status === 'answered' && a.answeredBy === me) {
    el.innerHTML = '<div class="center" style="margin-top:20px;font-weight:500">Orbit brief</div><div class="quote" style="margin-top:12px;text-align:center">' + (a.sys ? esc(a.sys + '/' + a.dia) + ' just now.' : 'Reason: ' + esc(a.why)) + '<br>' + esc(an.sentence) + '</div><div class="tl">' + a.log.map(function(l){ return '<div>' + clock(l.t) + '  ' + esc(l.text) + '</div>'; }).join('') + '</div><a class="btn red" href="tel:112">Call 112</a><button class="btn" id="hd">Mark as handled</button>';
    $('hd').onclick = function(){ hApi('handled').then(function(j){ take(j); cgRender(); }); };
    return;
  }
  var note = '';
  if (a && a.status === 'ringing') note = '<div class="idle">Alert for ' + esc(a.targetName) + '. You will be called if there is no answer.</div>';
  else if (a && a.status === 'answered') note = '<div class="idle">' + esc(a.answeredByName) + ' answered and is handling this.</div>';
  else if (a && a.status === 'handled') note = '<div class="idle"><b>Handled</b><br>' + esc(a.handledByName) + ' is on it.</div>';
  else if (a && a.status === 'cancelled') note = '<div class="idle"><b>Alert cancelled</b><br>' + esc(who) + ' says they are okay.</div>';
  else if (a && a.status === 'unanswered') note = '<div class="idle"><b>Alert not answered</b><br>Please call ' + esc(who) + ' now.</div>';
  else note = '<div class="idle">Armed. Waiting for an alert...</div>';
  var on = st.profile.alertsOn;
  var status = on ? '<div class="banner on" style="display:block">Phone alerts are ON. You will get a notification even if this page is closed.</div><div class="center"><button class="link" id="tp">Send me a test alert</button></div>'
    : '<div class="err center">' + esc(alertMsg || 'Phone alerts are not on yet.') + '</div><button class="btn" id="al">Turn on phone alerts</button>';
  var pn = st.careNumbers && st.careNumbers.patient;
  var calls = pn ? '<a class="btn green" href="tel:' + esc(pn) + '">Call ' + esc(who) + '</a>' : '';
  var nts = (st.notices || []).filter(function(x){ return x.kind === 'missed_dose'; }).slice(-3).reverse().map(function(x){ return '<div class="ev"><small>' + clock(x.t) + '</small><span>' + esc(x.text) + '</span></div>'; }).join('');
  el.innerHTML = note + summary + (nts ? '<div class="small" style="margin-top:10px">Tablet reminders</div>' + nts : '') + calls + status + '<div class="small center" style="margin-top:14px">If this page is open you will also hear a ring.</div>';
  var tp = $('tp'); if (tp) tp.onclick = function(){ hApi('testpush', {}).then(function(j){ tp.textContent = j && j.ok ? 'Test sent. Check your notifications' : 'Could not send the test'; }); };
  var al = $('al'); if (al) al.onclick = function(){ enableAlerts(function(ok, m){ alertMsg = ok ? '' : m; cgRender(); }, true); };
}

/* ---------- boot ---------- */
function boot(skipJoin){
  var join = params.get('join');
  if (join && !skipJoin) { joinLink(join); return; }
  if (sess && sess.role === 'patient') patientApp();
  else if (sess && sess.role === 'caregiver') caregiverApp();
  else if (sess && sess.role === 'clinician') location.href = '/studio.html';
  else welcome();
}
window.__orbit = { handle: handle };
if ('serviceWorker' in navigator && sess && sess.pid) { try { navigator.serviceWorker.register('/sw.js?p=' + sess.pid); } catch(e){} }
boot();
})();
</script>
