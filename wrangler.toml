name = "orbit-x"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
MODEL_BASE_URL = "https://inference.baseten.co/v1"
MODEL_TEXT = "meta-models/muse-spark-open-1026"
ESCALATE_MS = "20000"
ALLOWED_ORIGINS = "https://orbit-x.alecedoh1994.workers.dev"
# Secrets (set with `npx wrangler secret put NAME`, never here): MODEL_API_KEY, RECEIPT_SECRET, VAPID_SUBJECT (not secret; may go here), WHATSAPP_*

[[durable_objects.bindings]]
name = "ALERTS"
class_name = "AlertHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlertHub"]

[observability]
enabled = true

# After Orbit-X.Online is in your Cloudflare account, uncomment:
# [[routes]]
# pattern = "orbit-x.online"
# custom_domain = true
