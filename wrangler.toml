name = "orbit-x"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
MODEL_BASE_URL = "https://inference.baseten.co/v1"
MODEL_TEXT = "auto"
ESCALATE_MS = "20000"
ALLOWED_ORIGINS = "https://orbit-x.online,https://www.orbit-x.online"

[[durable_objects.bindings]]
name = "ALERTS"
class_name = "AlertHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlertHub"]

[observability]
enabled = true

# After Orbit-X.Online is in your Cloudflare account, uncomment:
# [[routes]]
# pattern = "orbit-x.online"
# custom_domain = true
