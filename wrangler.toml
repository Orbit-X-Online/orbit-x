name = "orbit-x"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/.well-known/assetlinks.json"]

[vars]
MODEL_BASE_URL = "https://inference.baseten.co/v1"
MODEL_TEXT = "meta-models/muse-spark-open-1026"
ESCALATE_MS = "20000"
ASSISTANT_CHAT = "off" # free-text AI chat is OFF (also off if this line is missing). Orbit answers only with fixed rules, logs and evidence from your own records.
ALLOWED_ORIGINS = "https://orbit-x.alecedoh1994.workers.dev"
# Sign-up CAPTCHA (Cloudflare Turnstile), OFF until you do both: add TURNSTILE_SITE_KEY = "0x...your site key..." in [vars] above, and run `npx wrangler secret put TURNSTILE_SECRET`.
# Secrets (set with `npx wrangler secret put NAME`, never here): MODEL_API_KEY, RECEIPT_SECRET, TURNSTILE_SECRET, WHATSAPP_*
# VAPID_SUBJECT is not secret: optionally add VAPID_SUBJECT = "mailto:you@your-email.example" above. If unset, the first https address in ALLOWED_ORIGINS is used.

# Downloads the PDF/Word/OCR reader files into public/vendor before every deploy (works with "wrangler deploy" and Cloudflare Git builds).
# If the download fails the deploy still goes ahead, but PDF/Word/photo reading on the phone will not work until `npm run vendor` succeeds.
[build]
command = "node scripts/vendor-libs.mjs || echo vendor-download-failed"

[[durable_objects.bindings]]
name = "ALERTS"
class_name = "AlertHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlertHub"]

[observability]
enabled = true

# If you later own a custom domain and add it to your Cloudflare account, uncomment and edit (and add it to ALLOWED_ORIGINS):
# [[routes]]
# pattern = "your-domain.example"
# custom_domain = true
